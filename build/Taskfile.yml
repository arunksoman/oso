version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/*
    preconditions:
      - sh: pnpm --version
        msg: "Looks like pnpm isn't installed. Install it with: npm install -g pnpm"
    cmds:
      - pnpm install

  build:frontend:
    summary: Build the frontend project
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - build/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - pnpm run build

  generate:bindings:
    summary: Generates TypeScript bindings for the frontend
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -ts -d frontend/bindings -clean=true oso

  generate:icons:
    summary: Generates Windows .ico file from appicon.png
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm run dev
