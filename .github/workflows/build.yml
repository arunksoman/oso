name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version to stamp into the binaries and packages (e.g. 1.2.3)"
        type: string
        required: false
        default: ""

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24.x"
  WAILS_VERSION: "v3.0.0-beta.26"
  NODE_OPTIONS: "--max-old-space-size=4096"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build frontend (generates bindings)
        run: wails3 task common:build:frontend

      - name: Go vet
        run: go vet ./...

      - name: Svelte check
        working-directory: frontend
        run: pnpm run check

  # Unit tests on Linux, Windows and macOS with the 95% coverage gates, plus
  # the end-to-end tests. Nothing is built or released unless this passes.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.name }})
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: windows-amd64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Read by the Taskfiles to stamp -X main.version into production builds
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --no-progress -y
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Stamp version
        if: inputs.version != ''
        run: |
          # info.version must be numeric X.Y.Z (NSIS and the Windows manifest reject
          # pre-release suffixes); info.displayVersion keeps the full tag version.
          NUMERIC_VERSION="${VERSION%%-*}"
          sed -i.bak -E \
            -e "s/^(  version: )\"[^\"]*\"/\1\"${NUMERIC_VERSION}\"/" \
            -e "s/^(  displayVersion: )\"[^\"]*\"/\1\"${VERSION}\"/" \
            build/config.yml && rm build/config.yml.bak
          grep -nE '^  (version|displayVersion):' build/config.yml
          # Regenerate Info.plist, NSIS, nfpm and Windows resource metadata

          wails3 update build-assets -name oso -binaryname oso -config build/config.yml -dir build -silent

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:build
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          mkdir -p dist
          cp bin/oso dist/oso-linux-amd64
          chmod +x dist/oso-linux-amd64
          cp bin/*.deb bin/*.rpm dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          wails3 task windows:package
          mkdir -p dist
          cp bin/oso.exe dist/oso-windows-amd64.exe
          cp bin/oso-amd64-installer.exe dist/oso-windows-amd64-installer.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package:universal
          mkdir -p dist
          ditto -c -k --keepParent bin/oso.app dist/oso-macos-universal.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oso-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
