name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - name: Parse version from tag
        id: version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.app_version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: oso-*
          merge-multiple: true

      # The in-app updater downloads oso-windows-amd64.exe, oso-linux-amd64 and
      # oso-macos-universal.zip (see updater.go) and verifies them against SHA256SUMS.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum oso-linux-amd64 oso-windows-amd64.exe oso-macos-universal.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Tags with a pre-release suffix (e.g. v0.7.0-beta.1) are not marked as latest
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/oso-linux-amd64
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/oso-windows-amd64.exe
            artifacts/oso-windows-amd64-installer.exe
            artifacts/oso-macos-universal.zip
            artifacts/SHA256SUMS
