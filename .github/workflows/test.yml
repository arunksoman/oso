name: Test

# Quality gate for the app. Runs on every pull request and, through build.yml,
# before anything is built or released: a release is only published when these
# jobs pass, including the 95% coverage gates.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  GO_VERSION: "1.25.x"
  NODE_VERSION: "24.x"
  NODE_OPTIONS: "--max-old-space-size=4096"
  # Minimum Go statement coverage; frontend thresholds live in frontend/vite.config.ts
  GO_COVERAGE_MIN: "95"
  # Server-mode builds are pure Go. With cgo on, Wails links GTK and WebKit on
  # Linux even under the server tag, and these jobs do not install them.
  CGO_ENABLED: "0"

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # The Go binary embeds frontend/dist, so it has to exist before go vet/test
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      # The server tag selects the headless Wails implementation: the Go tests
      # start a real Wails application without GTK, WebKit or a display.
      - name: Go vet
        run: go vet -tags server ./...

      - name: Go test with coverage gate
        run: node scripts/go-coverage.mjs

      - name: Svelte check
        if: runner.os == 'Linux'
        working-directory: frontend
        run: pnpm run check

      - name: Frontend test with coverage gate
        working-directory: frontend
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: |
            coverage.out
            frontend/coverage
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      # The real Go backend and frontend, served over HTTP instead of a window
      - name: Build server-mode app
        run: go build -tags server -buildvcs=false -o bin/oso-server .

      # Only the storage service: the tests create their own buckets
      - name: Start RustFS
        run: |
          if ! docker compose up -d --wait rustfs; then
            docker compose logs rustfs
            exit 1
          fi

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
