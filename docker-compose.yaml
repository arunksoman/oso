services:
  # RustFS, single node single disk
  rustfs:
    image: rustfs/rustfs:latest
    container_name: oso-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: osodev
      RUSTFS_SECRET_KEY: osodevpass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # A named volume, because RustFS runs as uid 10001 and cannot write to a
      # bind mount that Docker created as root
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: oso-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: osodev
      AWS_SECRET_ACCESS_KEY: osodevpass
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint:
      - /bin/sh
      - -ec
      - |
        aws s3api head-bucket --bucket oso-test 2>/dev/null || aws s3 mb s3://oso-test
        echo "RustFS init complete. Bucket: oso-test"
    restart: "no"

volumes:
  rustfs-data:

# RustFS connection values:
#   S3_ENDPOINT=http://localhost:9000
#   S3_ACCESS_KEY=osodev
#   S3_SECRET_KEY=osodevpass
#   S3_REGION=us-east-1
#   WebUI: http://localhost:9001  (login: osodev / osodevpass)
